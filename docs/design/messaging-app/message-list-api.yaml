openapi: 3.0.3
info:
  title: Message List Service API
  version: 1.0.0
paths:
  /customers/{customerId}/threads:
    get:
      operationId: listThreadsForCustomer
      summary: List message threads for a customer
      parameters:
        - name: customerId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Threads containing the customer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThreadCollection'
        '400':
          description: Invalid customer ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '502':
          description: Message service request failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
components:
  schemas:
    Message:
      type: object
      required:
        - messageId
        - threadId
        - senderCustomerId
        - recipientCustomerId
        - body
        - createdAt
      properties:
        messageId:
          type: string
          format: uuid
        threadId:
          type: string
          format: uuid
        parentMessageId:
          type: string
          format: uuid
          nullable: true
        senderCustomerId:
          type: string
          format: uuid
        recipientCustomerId:
          type: string
          format: uuid
        body:
          type: string
        createdAt:
          type: string
          format: date-time
    Thread:
      type: object
      required:
        - threadId
        - participantCustomerIds
        - messages
      properties:
        threadId:
          type: string
          format: uuid
        participantCustomerIds:
          type: array
          minItems: 2
          maxItems: 2
          items:
            type: string
            format: uuid
        messages:
          type: array
          items:
            $ref: '#/components/schemas/Message'
    ThreadCollection:
      type: object
      required:
        - threads
      properties:
        threads:
          type: array
          items:
            $ref: '#/components/schemas/Thread'
    ApiError:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
        message:
          type: string